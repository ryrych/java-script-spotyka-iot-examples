<!doctype html>
<html>
  <head>
    <title>Temperature</title>
    <link href="assets/css/main.css" rel="stylesheet" />
  </head>

  <body>
    <main>
      <section class="termometer-section">
        <div class="chart-container">
          <canvas id="myChart"></canvas>
        </div>

        <div class="termometer-wrapper">
          <div class="termometer">
            <div class="temperature" style="height: 0" data-value="0°C"></div>
          </div>
        </div>
      </section>

      <section class="info-box">
        <h1>Temperature</h1>
        <p>Read via simple <kbd>LM35</kbd> thermometer.</p>
        <button id="btn-read" class="is-hidden">Read temperature</button>
        <button id="btn-connect">Connect to Device</button>
      </section>

      <div id="log"></div>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
